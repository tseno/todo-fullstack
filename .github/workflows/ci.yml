name: CI

# PRごとにバックエンドのテストとフロントエンドのビルドを検証する
on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build & test)
    runs-on: ubuntu-latest

    # contextLoadsテストがDBに接続するため、テスト用のPostgresを起動しておく
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: テスト実行
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/todo
          SPRING_DATASOURCE_USERNAME: todo
          SPRING_DATASOURCE_PASSWORD: todo
        run: ./gradlew test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存インストール
        working-directory: frontend
        run: npm ci

      # NEXT_PUBLIC_* が無くてもビルドは通る（未設定時の動作は .env.example を参照）
      - name: ビルド（静的エクスポート）
        working-directory: frontend
        run: npm run build
